<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت درخواست‌ها و پایش سیستم</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Vazirmatn, sans-serif; background-color: #f4f7f6; color: #333; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .card-header { background: white; border-bottom: 1px solid #eee; padding: 1.5rem; border-radius: 15px 15px 0 0 !important; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 5px; }
        .status-success { background-color: #10b981; }
        .status-blocked { background-color: #ef4444; }
        .status-header { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 2rem; border-radius: 15px; margin-bottom: 2rem; }
        .table thead th { border-top: none; background: #f8fafc; text-transform: uppercase; font-size: 0.75rem; color: #64748b; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid px-5">
            <a class="navbar-brand fw-extrabold" href="/"><i class="fa-solid fa-gem me-2"></i> سامانه هوشمند</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">بازگشت به تحلیل</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="status-header shadow-sm d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-black mb-1">مدیریت تراکنش‌ها و سلامت سیستم</h2>
                <p class="mb-0 opacity-75">پایش بی‌درنگ درخواست‌های API و وضعیت بلاک‌شدن توسط فایروال</p>
            </div>
            <div class="text-end">
                <div class="h3 fw-black mb-0" id="current_time">00:00:00</div>
                <div class="small opacity-75" id="current_date">---</div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h6 class="text-secondary fw-bold">کل درخواست‌ها</h6>
                    <div class="h2 fw-black text-primary" id="total_reqs">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h6 class="text-secondary fw-bold">موفقیت‌آمیز</h6>
                    <div class="h2 fw-black text-success" id="success_reqs">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h6 class="text-secondary fw-bold">مسدود شده (Blocked)</h6>
                    <div class="h2 fw-black text-danger" id="blocked_reqs">0</div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-black"><i class="fa-solid fa-history me-2"></i> تاریخچه ۵۰ درخواست اخیر</h5>
                        <button class="btn btn-sm btn-outline-primary" onclick="updateStats()"><i class="fa-solid fa-sync"></i> بروزرسانی</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>زمان</th>
                                        <th>سرویس</th>
                                        <th>اندپوینت</th>
                                        <th>وضعیت</th>
                                    </tr>
                                </thead>
                                <tbody id="history_table_body">
                                    <!-- Dynamic content -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-black"><i class="fa-solid fa-server me-2"></i> تفکیک سرویس‌ها</h5>
                        <button class="btn btn-sm btn-outline-danger" onclick="clearCache()"><i class="fa-solid fa-trash-can me-1"></i> پاکسازی کش</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table mb-0">
                                <thead>
                                    <tr>
                                        <th>نام سرویس</th>
                                        <th>تعداد</th>
                                        <th>نرخ موفقیت</th>
                                    </tr>
                                </thead>
                                <tbody id="services_table_body">
                                    <!-- Dynamic content -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function updateStats() {
            try {
                const resp = await fetch('/api/market_status');
                const data = await resp.json();
                
                document.getElementById('total_reqs').textContent = data.stats.global.total;
                document.getElementById('success_reqs').textContent = data.stats.global.success;
                document.getElementById('blocked_reqs').textContent = data.stats.global.blocked;

                // Update History
                const histBody = document.getElementById('history_table_body');
                histBody.innerHTML = data.stats.history.map(h => `
                    <tr>
                        <td class="small fw-bold">${h.time}</td>
                        <td><span class="badge bg-light text-dark border">${h.service}</span></td>
                        <td class="small text-truncate" style="max-width: 200px;" title="${h.endpoint}">${h.endpoint}</td>
                        <td>
                            <span class="status-dot ${h.status === 'success' ? 'status-success' : 'status-blocked'}"></span>
                            <span class="small fw-bold ${h.status === 'success' ? 'text-success' : 'text-danger'}">
                                ${h.status === 'success' ? 'اوکی' : 'مسدود'}
                            </span>
                        </td>
                    </tr>
                `).join('');

                // Update Services
                const servBody = document.getElementById('services_table_body');
                servBody.innerHTML = '';
                for (const [name, s] of Object.entries(data.stats.services)) {
                    const rate = s.total > 0 ? Math.round((s.success / s.total) * 100) : 0;
                    servBody.innerHTML += `
                        <tr>
                            <td class="fw-bold">${name}</td>
                            <td>${s.total}</td>
                            <td>
                                <div class="progress" style="height: 6px;">
                                    <div class="progress-bar ${rate > 50 ? 'bg-success' : 'bg-danger'}" style="width: ${rate}%"></div>
                                </div>
                                <small class="fw-bold">${rate}%</small>
                            </td>
                        </tr>
                    `;
                }
            } catch (e) { console.error(e); }
        }

        async function clearCache() {
            if (!confirm("آیا از پاکسازی تمام حافظه کش اطمینان دارید؟")) return;
            try {
                const resp = await fetch('/api/clear_cache', { method: 'POST' });
                const data = await resp.json();
                alert(data.message);
            } catch (e) { alert("خطا در ارتباط با سرور"); }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('current_time').textContent = now.toLocaleTimeString('fa-IR');
            document.getElementById('current_date').textContent = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { dateStyle: 'full' }).format(now);
        }

        setInterval(updateClock, 1000);
        setInterval(updateStats, 5000);
        updateClock();
        updateStats();
    </script>
</body>
</html>
